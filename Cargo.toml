[package]
name = "caps-switch"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Switch Windows keyboard layout with CapsLock (emulates Alt+Shift, no overlay delay)"
license = "MIT"
authors = ["Sergey Nikolaev <s.nikolaev@nklv.su>"]
repository = "https://github.com/svnikolaev/caps-switch"
readme = "README.md"
keywords = ["capslock", "keyboard", "layout", "windows", "input"]
categories = ["os::windows-apis"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

