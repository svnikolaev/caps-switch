name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $exe = "target\release\caps-switch.exe"
          $version = & $exe --version
          if ($version.Trim() -ne (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value) {
            throw "unexpected version: $version"
          }
          & $exe --status | Out-Null
          & $exe --help | Out-Null
          & $exe --bogus 2>$null
          if ($LASTEXITCODE -ne 64) { throw "expected exit code 64 for bad argument" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caps-switch-windows-x64
          path: target/release/caps-switch.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/caps-switch.exe
          generate_release_notes: true
